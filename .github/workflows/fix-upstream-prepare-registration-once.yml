name: Restore Prepare card registrations once

on:
  push:
    branches:
      - automation/upstream-sync-prep-20260917

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the upstream sync PR branch
        uses: actions/checkout@v7
        with:
          ref: automation/upstream-sync
          fetch-depth: 1

      - name: Restore implemented cards removed by stale unfinished list
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "b825b4a3555edbd0ea97f0c5ff3c405c7729300e" ]; then
            echo '::error::Upstream sync PR branch moved; stop to avoid overwriting changes.'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('Mage.Sets/src/mage/sets/SecretsOfStrixhaven.java')
          source = path.read_text(encoding='utf-8')
          prefix = '    private static final List<String> unfinished = Arrays.asList('
          lines = source.splitlines(keepends=True)
          candidates = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(candidates) != 1:
              raise RuntimeError(f'Expected one unfinished list, found {len(candidates)}')
          i = candidates[0]
          if not lines[i].rstrip('\n').endswith(');'):
              raise RuntimeError('Unexpected unfinished list syntax')
          names = re.findall(r'"([^"\n]+)"', lines[i][len(prefix):])
          restore = {
              'Goblin Glasswright': 'mage.cards.g.GoblinGlasswright.class',
              'Quill-Blade Laureate': 'mage.cards.q.QuillBladeLaureate.class',
              'Lluwen, Exchange Student': 'mage.cards.l.LluwenExchangeStudent.class',
              'Encouraging Aviator': 'mage.cards.e.EncouragingAviator.class',
              'Emeritus of Woe': 'mage.cards.e.EmeritusOfWoe.class',
          }
          if len(names) != len(set(names)):
              raise RuntimeError('Duplicate unfinished entries detected')
          if any(names.count(name) != 1 for name in restore):
              raise RuntimeError(f'Missing or duplicate entries to restore: {restore.keys()}')
          for name, java_class in restore.items():
              registration = f'new SetCardInfo("{name}", '
              if registration not in source or java_class not in source:
                  raise RuntimeError(f'No existing SetCardInfo registration for {name}')
              qualified = java_class.removeprefix('mage.cards.').removesuffix('.class')
              letter, class_name = qualified.split('.', 1)
              if not Path(f'Mage.Sets/src/mage/cards/{letter}/{class_name}.java').is_file():
                  raise RuntimeError(f'Implementation is absent: {name}')
          remaining = [name for name in names if name not in restore]
          lines[i] = prefix + ', '.join(f'"{name}"' for name in remaining) + ');\n'
          updated = ''.join(lines)
          for name in restore:
              if name in lines[i]:
                  raise RuntimeError(f'{name} is still excluded')
          if updated == source:
              raise RuntimeError('Expected registry change was not made')
          path.write_text(updated, encoding='utf-8')
          print('Restored five card registrations without changing other exclusions.')
          PY
          git diff --check
          git diff -- Mage.Sets/src/mage/sets/SecretsOfStrixhaven.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Mage.Sets/src/mage/sets/SecretsOfStrixhaven.java
          git commit -m 'Restore Prepare card registrations after upstream merge'
          git push origin HEAD:refs/heads/automation/upstream-sync
