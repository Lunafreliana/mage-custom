name: Publish XMage Custom Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-xmage-custom
  cancel-in-progress: false

jobs:
  publish:
    # Keep publishing off GitHub-hosted runners. This job is intentionally sent
    # to the lightweight local runner that also handles the labeler workflows.
    runs-on: [self-hosted, windows, x64, xmage]
    timeout-minutes: 60

    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Setup Maven 3.9.16
        shell: powershell
        run: |
          $version = '3.9.16'
          $mavenRoot = Join-Path $env:RUNNER_TOOL_CACHE "apache-maven\$version"
          $mavenHome = Join-Path $mavenRoot "apache-maven-$version"
          $mvnCmd = Join-Path $mavenHome 'bin\mvn.cmd'

          if (-not (Test-Path $mvnCmd)) {
            New-Item -ItemType Directory -Force -Path $mavenRoot | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP "apache-maven-$version-bin.zip"
            $url = "https://dlcdn.apache.org/maven/maven-3/$version/binaries/apache-maven-$version-bin.zip"

            Write-Host "Downloading Apache Maven $version..."
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
            $checksumText = (Invoke-WebRequest -UseBasicParsing -Uri "$url.sha512").Content
            $expected = [regex]::Match($checksumText, '[A-Fa-f0-9]{128}').Value.ToLowerInvariant()
            $actual = (Get-FileHash -Path $zip -Algorithm SHA512).Hash.ToLowerInvariant()
            if (-not $expected -or $actual -ne $expected) {
              throw 'Apache Maven SHA-512 verification failed.'
            }

            Expand-Archive -Path $zip -DestinationPath $mavenRoot -Force
            Remove-Item $zip -Force
          }

          "MAVEN_HOME=$mavenHome" >> $env:GITHUB_ENV
          (Join-Path $mavenHome 'bin') >> $env:GITHUB_PATH

      - name: Show Java and Maven versions
        shell: cmd
        run: |
          java -version
          mvn -version

      - name: Build XMage
        shell: cmd
        run: mvn -B clean install "-DskipTests"

      - name: Build client package
        working-directory: Mage.Client
        shell: cmd
        run: mvn -B package assembly:single "-DskipTests"

      - name: Force custom server configuration
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'Mage.Server\release\config\config.xml'

          $doc = New-Object System.Xml.XmlDocument
          $doc.PreserveWhitespace = $true
          $doc.Load($path)

          $server = $doc.SelectSingleNode('/config/server')
          if ($null -eq $server) {
            throw 'Could not find /config/server in config.xml'
          }

          $server.SetAttribute('serverAddress', 'megerk.de')
          $server.SetAttribute('port', '17171')
          $server.SetAttribute('secondaryBindPort', '17172')

          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $settings.Indent = $false

          $writer = [System.Xml.XmlWriter]::Create($path, $settings)
          try {
            $doc.Save($writer)
          } finally {
            $writer.Dispose()
          }

          Write-Host 'Forced server config values:'
          Write-Host "  serverAddress=$($server.GetAttribute('serverAddress'))"
          Write-Host "  port=$($server.GetAttribute('port'))"
          Write-Host "  secondaryBindPort=$($server.GetAttribute('secondaryBindPort'))"

      - name: Build server package
        working-directory: Mage.Server
        shell: cmd
        run: mvn -B package assembly:single "-DskipTests"

      - name: Create mage-bundle.zip
        shell: powershell
        run: |
          $bundleTemp = Join-Path $env:GITHUB_WORKSPACE 'bundle-temp'
          $bundleZip = Join-Path $env:GITHUB_WORKSPACE 'mage-bundle.zip'
          Remove-Item $bundleTemp -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $bundleZip -Force -ErrorAction SilentlyContinue

          $clientDir = Join-Path $bundleTemp 'mage-client'
          $serverDir = Join-Path $bundleTemp 'mage-server'
          New-Item -ItemType Directory -Force -Path $clientDir, $serverDir | Out-Null

          Expand-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'Mage.Client\target\mage-client.zip') -DestinationPath $clientDir -Force
          Expand-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'Mage.Server\target\mage-server.zip') -DestinationPath $serverDir -Force
          Compress-Archive -Path (Join-Path $bundleTemp '*') -DestinationPath $bundleZip -CompressionLevel Optimal
          Get-Item $bundleZip | Format-List Name, Length, LastWriteTime

      - name: Prepare release metadata
        id: meta
        shell: powershell
        run: |
          [xml]$pom = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'pom.xml')
          $baseVersion = [string]$pom.project.version
          if (-not $baseVersion) {
            throw 'Could not read project.version from pom.xml'
          }

          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMddTHHmmss')
          $xmageVersion = "$baseVersion-dev ($stamp)"
          $assetUrl = "https://github.com/Lunafreliana/xmage-custom-builds/releases/download/$stamp/mage-bundle.zip"

          "stamp=$stamp" >> $env:GITHUB_OUTPUT
          "xmage_version=$xmageVersion" >> $env:GITHUB_OUTPUT
          "asset_url=$assetUrl" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.XMAGE_PUBLISH_TOKEN }}
          STAMP: ${{ steps.meta.outputs.stamp }}
        shell: powershell
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          gh release create $env:STAMP mage-bundle.zip `
            --repo Lunafreliana/xmage-custom-builds `
            --title "XMage Custom $env:STAMP" `
            --notes "Automatic custom XMage build from Lunafreliana/mage-custom@$shortSha."

      - name: Checkout launcher feed repository
        uses: actions/checkout@v6
        with:
          repository: Lunafreliana/xmage-custom-builds
          ref: main
          path: publish-repo
          token: ${{ secrets.XMAGE_PUBLISH_TOKEN }}

      - name: Update launcher config.json
        env:
          XMAGE_VERSION: ${{ steps.meta.outputs.xmage_version }}
          ASSET_URL: ${{ steps.meta.outputs.asset_url }}
          STAMP: ${{ steps.meta.outputs.stamp }}
        shell: powershell
        run: |
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'publish-repo')

          $configPath = Join-Path (Get-Location) 'config.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.XMage.version = $env:XMAGE_VERSION
          $config.XMage.location = $env:ASSET_URL
          $config.XMage.full = $env:ASSET_URL
          $json = $config | ConvertTo-Json -Depth 100
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($configPath, $json + [Environment]::NewLine, $utf8NoBom)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.json
          git commit -m "Publish XMage custom build $env:STAMP"
          git push

      - name: Publish summary
        shell: powershell
        run: |
          "## XMage custom build published" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Version: ${{ steps.meta.outputs.xmage_version }}" >> $env:GITHUB_STEP_SUMMARY
          "- Release: https://github.com/Lunafreliana/xmage-custom-builds/releases/tag/${{ steps.meta.outputs.stamp }}" >> $env:GITHUB_STEP_SUMMARY
          "- Launcher home stays: https://lunafreliana.github.io/xmage-custom-builds/" >> $env:GITHUB_STEP_SUMMARY
