name: Build and run tests (self-hosted)

on:
  push:
    branches: [ "custom" ]
  pull_request:
    branches: [ "custom" ]

  # allow manual run
  workflow_dispatch: {}

# allow fast cancel on new commit to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Run the full Maven suite on the local Windows runner instead of consuming
    # GitHub-hosted Actions minutes.
    runs-on: [self-hosted, windows, x64]

    steps:
    - uses: actions/checkout@v6

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        java-package: 'jdk'

    - name: Show Java and Maven versions
      shell: powershell
      run: |
        java -version
        mvn -version

    - name: Build and test
      shell: powershell
      run: |
        $log4j = (Join-Path $env:GITHUB_WORKSPACE ".travis\log4j.properties").Replace('\', '/')
        mvn test -B -Dxmage.dataCollectors.printGameLogs=false "-Dlog4j.configuration=file:$log4j"
