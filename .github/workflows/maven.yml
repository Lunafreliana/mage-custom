name: Build and run tests (GitHub-hosted)

on:
  push:
    branches: [ "custom" ]
  pull_request:
    branches: [ "custom" ]

  # allow manual run
  workflow_dispatch: {}

# allow fast cancel on new commit to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Keep the existing Windows-specific build commands, but run them on a
    # GitHub-hosted Windows runner.
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        java-package: 'jdk'
        cache: 'maven'

    - name: Setup Maven 3.9.16
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
      run: |
        $version = '3.9.16'
        $mavenRoot = Join-Path $env:RUNNER_TOOL_CACHE "apache-maven\$version"
        $mavenHome = Join-Path $mavenRoot "apache-maven-$version"
        $mvnCmd = Join-Path $mavenHome 'bin\mvn.cmd'

        if (-not (Test-Path $mvnCmd)) {
          New-Item -ItemType Directory -Force -Path $mavenRoot | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "apache-maven-$version-bin.zip"
          $url = "https://dlcdn.apache.org/maven/maven-3/$version/binaries/apache-maven-$version-bin.zip"

          Write-Host "Downloading Apache Maven $version..."
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
          $checksumText = (Invoke-WebRequest -UseBasicParsing -Uri "$url.sha512").Content
          $expected = [regex]::Match($checksumText, '[A-Fa-f0-9]{128}').Value.ToLowerInvariant()
          $actual = (Get-FileHash -Path $zip -Algorithm SHA512).Hash.ToLowerInvariant()
          if (-not $expected -or $actual -ne $expected) {
            throw 'Apache Maven SHA-512 verification failed.'
          }

          Expand-Archive -Path $zip -DestinationPath $mavenRoot -Force
          Remove-Item $zip -Force
        }

        "MAVEN_HOME=$mavenHome" >> $env:GITHUB_ENV
        (Join-Path $mavenHome 'bin') >> $env:GITHUB_PATH

    - name: Show Java and Maven versions
      shell: cmd
      run: |
        java -version
        mvn -version

    - name: Build and test
      shell: powershell
      run: |
        $maxAttempts = 3
        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          Write-Host "Maven test attempt $attempt of $maxAttempts"
          & mvn --settings "$env:GITHUB_WORKSPACE/.github/maven-settings.xml" test -B `
            "-Dxmage.dataCollectors.printGameLogs=false" `
            "-Dlog4j.configuration=file:$env:GITHUB_WORKSPACE/.travis/log4j.properties"
          $mavenExitCode = $LASTEXITCODE
          if ($mavenExitCode -eq 0) {
            exit 0
          }
          if ($attempt -lt $maxAttempts) {
            Write-Warning "Maven exited with code $mavenExitCode; retrying in 15 seconds."
            Start-Sleep -Seconds 15
          }
        }
        exit $mavenExitCode
