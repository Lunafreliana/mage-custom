name: Build and run tests (github)

on:
  push:
    branches: [ "custom" ]
  pull_request:
    branches: [ "custom" ]

  # allow manual run
  workflow_dispatch: {}

# allow fast cancel on new commit to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            distribution: 'temurin'
            package: 'jdk'
    steps:
    - uses: actions/checkout@v6
    - name: Setup JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: ${{ matrix.distribution }}
        java-package: ${{ matrix.package }}
        cache: maven
    - name: Build and test
      run: mvn test -B -Dxmage.dataCollectors.printGameLogs=false -Dlog4j.configuration=file:${GITHUB_WORKSPACE}/.travis/log4j.properties
