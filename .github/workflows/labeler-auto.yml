name: "Pull Request Labeler (auto)"
on:
  - pull_request_target

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: [self-hosted, windows, x64, xmage]
    steps:
      - id: label-the-PR
        uses: actions/labeler@v6
        with:
          configuration-path: '.github/labeler.yml'
