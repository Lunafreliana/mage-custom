name: Cyberman WHO reminder path one-time fix

on:
  push:
    branches:
      - automation/cyberman-who-path-once-20260919

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded Cyberman image path and regression fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/custom:refs/remotes/origin/custom' '+refs/heads/fix/cyberman-reminder-who-path:refs/remotes/origin/fix/cyberman-reminder-who-path'
          test "$(git rev-parse origin/custom)" = 'baed713f22de2a6623e4ed7e24dbbd00b7dce775'
          test "$(git rev-parse origin/fix/cyberman-reminder-who-path)" = 'baed713f22de2a6623e4ed7e24dbbd00b7dce775'
          git checkout -B fix/cyberman-reminder-who-path origin/fix/cyberman-reminder-who-path
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise RuntimeError(f'{path}: expected {count} occurrences, found {found}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          repo = 'Mage/src/main/java/mage/cards/repository/TokenRepository.java'
          replace(repo,
                  '    public static final String XMAGE_TOKENS_SET_CODE = "XMAGE";\n',
                  '    public static final String XMAGE_TOKENS_SET_CODE = "XMAGE";\n'
                  '    public static final String CYBERMAN_REMINDER_SET_CODE = "WHO";\n')
          replace(repo,
                  '        res.add(createXmageToken(XMAGE_IMAGE_NAME_FACE_DOWN_CYBERMAN, 1, "https://api.scryfall.com/cards/twho/24/en?format=image"));',
                  '        res.add(new TokenInfo(TokenType.XMAGE, XMAGE_IMAGE_NAME_FACE_DOWN_CYBERMAN,\n'
                  '                CYBERMAN_REMINDER_SET_CODE, 1)\n'
                  '                .withDownloadUrl("https://api.scryfall.com/cards/twho/24/en?format=image"));')

          view = 'Mage.Common/src/main/java/mage/view/CardView.java'
          replace(view,
                  '            if (imageSetCode.equals(TokenRepository.XMAGE_TOKENS_SET_CODE)) {',
                  '            if (imageSetCode.equals(TokenRepository.XMAGE_TOKENS_SET_CODE)\n'
                  '                    || (isFaceDown\n'
                  '                    && imageSetCode.equals(TokenRepository.CYBERMAN_REMINDER_SET_CODE)\n'
                  '                    && imageFileName.equals(TokenRepository.XMAGE_IMAGE_NAME_FACE_DOWN_CYBERMAN))) {')

          utils = 'Mage.Client/src/main/java/org/mage/plugins/card/utils/CardImageUtils.java'
          replace(utils,
                  '        boolean isTokenRepository = isPlanarCard\n'
                  '                || card.getMageObjectType().isUseTokensRepository()\n'
                  '                || card.getExpansionSetCode().equals(TokenRepository.XMAGE_TOKENS_SET_CODE);\n'
                  '        // if token from a card then must use card repository instead\n'
                  '        if (isTokenRepository && !isPlanarCard && !card.getCardNumber().isEmpty()) {',
                  '        boolean isCybermanReminder = card.isFaceDown()\n'
                  '                && card.getExpansionSetCode().equals(TokenRepository.CYBERMAN_REMINDER_SET_CODE)\n'
                  '                && imageFileName.equals(TokenRepository.XMAGE_IMAGE_NAME_FACE_DOWN_CYBERMAN);\n'
                  '        boolean isTokenRepository = isPlanarCard\n'
                  '                || card.getMageObjectType().isUseTokensRepository()\n'
                  '                || card.getExpansionSetCode().equals(TokenRepository.XMAGE_TOKENS_SET_CODE)\n'
                  '                || isCybermanReminder;\n'
                  '        // A nonempty, nonzero collector number identifies a regular card, not a token.\n'
                  '        if (isTokenRepository && !isPlanarCard && !card.getCardNumber().isEmpty()\n'
                  '                && !"0".equals(card.getCardNumber())) {')

          server_test = 'Mage.Tests/src/test/java/org/mage/test/cards/single/who/CyberConversionTest.java'
          replace(server_test,
                  '        Assert.assertEquals(TokenRepository.XMAGE_TOKENS_SET_CODE, permanent.getExpansionSetCode());',
                  '        Assert.assertEquals(TokenRepository.CYBERMAN_REMINDER_SET_CODE, permanent.getExpansionSetCode());\n'
                  '        Assert.assertEquals("0", permanent.getCardNumber());')
          replace(server_test,
                  '        Assert.assertEquals(TokenRepository.XMAGE_TOKENS_SET_CODE, view.getExpansionSetCode());',
                  '        Assert.assertEquals(TokenRepository.CYBERMAN_REMINDER_SET_CODE, view.getExpansionSetCode());\n'
                  '        Assert.assertEquals("0", view.getCardNumber());')
          replace(server_test,
                  '        Assert.assertEquals("https://api.scryfall.com/cards/twho/24/en?format=image", reminder.getDownloadUrl());',
                  '        Assert.assertEquals("https://api.scryfall.com/cards/twho/24/en?format=image", reminder.getDownloadUrl());\n'
                  '        Assert.assertEquals(TokenRepository.CYBERMAN_REMINDER_SET_CODE, reminder.getSetCode());\n'
                  '        Assert.assertEquals(reminder.getDownloadUrl(),\n'
                  '                TokenRepository.instance.prepareScryfallDownloadList().get("WHO/Cyberman/1"));')

          client_test = 'Mage.Client/src/test/java/mage/client/game/ScryfallImagesDownloadTest.java'
          replace(client_test,
                  'import mage.cards.decks.PlanarDeckCard;\n',
                  'import mage.cards.decks.PlanarDeckCard;\n'
                  'import mage.cards.repository.TokenInfo;\n'
                  'import mage.cards.repository.TokenRepository;\n')
          replace(client_test,
                  '    @Test\n    public void test_RealTokensRemainOnTokenPath() throws Exception {',
                  '    @Test\n'
                  '    public void test_CybermanReminderUsesWhoTokenImage() throws Exception {\n'
                  '        TokenInfo reminder = TokenRepository.instance.findPreferredTokenInfoForXmage(\n'
                  '                TokenRepository.XMAGE_IMAGE_NAME_FACE_DOWN_CYBERMAN, null);\n'
                  '        Assert.assertNotNull(reminder);\n'
                  '        Assert.assertEquals(TokenRepository.CYBERMAN_REMINDER_SET_CODE, reminder.getSetCode());\n'
                  '\n'
                  '        CardDownloadData token = new CardDownloadData(\n'
                  '                reminder.getName(), reminder.getSetCode(), "0", false, reminder.getImageNumber());\n'
                  '        token.setToken(true);\n'
                  '        CardImageSource imageSource = ScryfallImageSource.getInstance();\n'
                  '        Assert.assertTrue(imageSource.isTokenImageProvided(\n'
                  '                reminder.getSetCode(), reminder.getName(), reminder.getImageNumber()));\n'
                  '        Assert.assertEquals(reminder.getDownloadUrl(), imageSource.generateTokenUrl(token).getBaseUrl());\n'
                  '        Assert.assertEquals(CardImageUtils.buildImagePathToTokens() + "WHO"\n'
                  '                        + java.io.File.separator + "Cyberman 1.full.jpg",\n'
                  '                CardImageUtils.buildImagePathToCardOrToken(token));\n'
                  '    }\n'
                  '\n'
                  '    @Test\n    public void test_RealTokensRemainOnTokenPath() throws Exception {')
          PY
          git diff --check
          git diff --stat
          git add Mage/src/main/java/mage/cards/repository/TokenRepository.java Mage.Common/src/main/java/mage/view/CardView.java Mage.Client/src/main/java/org/mage/plugins/card/utils/CardImageUtils.java Mage.Tests/src/test/java/org/mage/test/cards/single/who/CyberConversionTest.java Mage.Client/src/test/java/mage/client/game/ScryfallImagesDownloadTest.java
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(images): load Cyberman reminder from WHO token directory'
          git push origin HEAD:refs/heads/fix/cyberman-reminder-who-path