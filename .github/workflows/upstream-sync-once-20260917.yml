name: Prepare one-time upstream sync

on:
  push:
    branches:
      - automation/upstream-sync-prep-20260917

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out custom with complete history
        uses: actions/checkout@v7
        with:
          ref: custom
          fetch-depth: 0

      - name: Merge pinned official upstream and resolve known conflicts
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=98e02373ce5f7728ecae9674b5dc2758821a2b55
          UPSTREAM_SHA=5515f7852e59ca70621b6203342dd36764aa655e
          if [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo '::error::custom has moved since this sync was prepared; stop instead of discarding newer changes.'
            exit 1
          fi
          git remote add upstream https://github.com/magefree/mage.git
          git fetch upstream master
          git merge-base --is-ancestor "$UPSTREAM_SHA" upstream/master
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C automation/upstream-sync "$BASE_SHA"

          if git merge --no-commit --no-ff "$UPSTREAM_SHA"; then
            echo 'Official upstream merged without conflicts.'
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | LC_ALL=C sort)
            expected=(
              '.github/workflows/maven.yml'
              'Mage.Sets/src/mage/cards/y/YargleGoliathOfOtaria.java'
              'Mage.Sets/src/mage/sets/RealityFracture.java'
              'Mage.Sets/src/mage/sets/RealityFractureCommander.java'
              'Mage.Sets/src/mage/sets/SecretsOfStrixhaven.java'
            )
            printf 'Unmerged files:\n%s\n' "${conflicts[*]}"
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              echo '::error::Unexpected conflict set. No branch will be pushed. Review manually.'
              exit 1
            fi

            # Keep the whole customized CI workflow; Yargle is the explicit upstream exception.
            git checkout --ours -- .github/workflows/maven.yml
            git checkout --theirs -- Mage.Sets/src/mage/cards/y/YargleGoliathOfOtaria.java

            # Preserve automatically merged upstream edits outside conflicting hunks.
            # In the three set registries, prefer custom only for the actual conflict hunks.
            python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('Mage.Sets/src/mage/sets/RealityFracture.java'),
              Path('Mage.Sets/src/mage/sets/RealityFractureCommander.java'),
              Path('Mage.Sets/src/mage/sets/SecretsOfStrixhaven.java'),
          ]
          for path in paths:
              output = []
              state = 'outside'
              count = 0
              for line in path.read_text(encoding='utf-8').splitlines(keepends=True):
                  if line.startswith('<<<<<<< '):
                      if state != 'outside':
                          raise RuntimeError(f'Nested conflict in {path}')
                      state = 'ours'
                      count += 1
                  elif line.startswith('=======') and state == 'ours':
                      state = 'theirs'
                  elif line.startswith('>>>>>>> ') and state == 'theirs':
                      state = 'outside'
                  elif state in ('outside', 'ours'):
                      output.append(line)
              if state != 'outside' or count == 0:
                  raise RuntimeError(f'Unexpected conflict markers in {path}: state={state}, count={count}')
              path.write_text(''.join(output), encoding='utf-8')
              print(f'Resolved {count} conflicting hunks in {path} in favor of custom')
          PY
            git add -- .github/workflows/maven.yml \
              Mage.Sets/src/mage/cards/y/YargleGoliathOfOtaria.java \
              Mage.Sets/src/mage/sets/RealityFracture.java \
              Mage.Sets/src/mage/sets/RealityFractureCommander.java \
              Mage.Sets/src/mage/sets/SecretsOfStrixhaven.java
          fi

          if [ -n "$(git ls-files -u)" ]; then
            echo '::error::Unresolved merge entries remain; no branch will be pushed.'
            exit 1
          fi
          # Upstream already has whitespace warnings in unrelated files; only
          # check the files resolved by this task rather than reformat upstream.
          git diff --cached --check -- \
            .github/workflows/maven.yml \
            Mage.Sets/src/mage/cards/y/YargleGoliathOfOtaria.java \
            Mage.Sets/src/mage/sets/RealityFracture.java \
            Mage.Sets/src/mage/sets/RealityFractureCommander.java \
            Mage.Sets/src/mage/sets/SecretsOfStrixhaven.java
          git diff --check
          git commit -m "Sync official XMage upstream ${UPSTREAM_SHA:0:7} (preserve custom conflicts except Yargle)"
          echo '--- Merge parents and changed-file summary ---'
          git log -1 --format='%H %P %s'
          git diff --stat "$BASE_SHA" HEAD
          git push origin HEAD:refs/heads/automation/upstream-sync
