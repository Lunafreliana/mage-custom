name: Resolve Path PR conflicts once

on:
  push:
    branches:
      - automation/resolve-path-pr-conflicts-20260917

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge current custom into each existing PR and preserve its own card
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=10a59473b1808df9648d6f1133728002652abfc0
          EFFECT=Mage/src/main/java/mage/abilities/effects/common/WillOfThePlaneswalkersEffect.java
          REGISTRY=Mage.Sets/src/mage/sets/MarchOfTheMachineCommander.java
          git fetch origin \
            '+refs/heads/custom:refs/remotes/origin/custom' \
            '+refs/heads/codex/implement-path-of-the-animist:refs/remotes/origin/codex/implement-path-of-the-animist' \
            '+refs/heads/codex/implement-path-of-the-schemer:refs/remotes/origin/codex/implement-path-of-the-schemer'
          if [ "$(git rev-parse origin/custom)" != "$BASE_SHA" ]; then
            echo '::error::custom moved; stop rather than merge against an outdated base.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for pr in 288 287; do
            if [ "$pr" = 288 ]; then
              branch=codex/implement-path-of-the-animist
              original=cef35a4f3357f662dd9cb8b5da01d057d1668bc1
              card='Path of the Animist'
              file_to_keep=Mage.Tests/src/test/java/org/mage/test/cards/single/moc/PathOfTheAnimistTest.java
              second_file_to_keep=''
            else
              branch=codex/implement-path-of-the-schemer
              original=be741277c1064ac3263f7b403224e1c9c4b5ecee
              card='Path of the Schemer'
              file_to_keep=Mage.Sets/src/mage/cards/p/PathOfTheSchemer.java
              second_file_to_keep=Mage.Tests/src/test/java/org/mage/test/cards/single/mom/PathOfTheSchemerTest.java
            fi
            if [ "$(git rev-parse "origin/$branch")" != "$original" ]; then
              echo "::error::PR #$pr has moved; stop without overwriting any newer changes."
              exit 1
            fi
            git switch -C "$branch" "$original"
            echo "--- Merging custom into PR #$pr ($branch) ---"
            if git merge --no-commit --no-ff "$BASE_SHA"; then
              echo 'Automatic merge completed.'
            else
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U | LC_ALL=C sort)
              printf 'Conflicts for PR #%s:\n%s\n' "$pr" "${conflicts[*]}"
              if [ "${#conflicts[@]}" -eq 0 ]; then
                echo '::error::Merge failed without any file conflicts.'
                exit 1
              fi
              for path in "${conflicts[@]}"; do
                if [ "$path" != "$EFFECT" ] && [ "$path" != "$REGISTRY" ]; then
                  echo "::error::Unexpected conflict: $path; no unsafe automatic resolution."
                  exit 1
                fi
              done
            fi

            # Both PRs reimplemented voting. Keep the already-merged and tested
            # implementation from custom (PR #289), including its Planechase guard.
            git checkout "$BASE_SHA" -- "$EFFECT"
            # The PR's only change in this registry is enabling its own card.
            # Start from custom so Path of the Enigma and other changes survive.
            git checkout "$BASE_SHA" -- "$REGISTRY"
            PR_NUMBER="$pr" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('Mage.Sets/src/mage/sets/MarchOfTheMachineCommander.java')
          content = path.read_text(encoding='utf-8')
          cards = {
              '288': ('Path of the Animist', '38', 'PathOfTheAnimist'),
              '287': ('Path of the Schemer', '28', 'PathOfTheSchemer'),
          }
          name, number, cls = cards[os.environ['PR_NUMBER']]
          entry = f'        cards.add(new SetCardInfo("{name}", {number}, Rarity.RARE, mage.cards.p.{cls}.class));'
          commented = '//' + entry
          if content.count(commented) != 1 or content.count('\n' + entry + '\n') != 0:
              raise RuntimeError(f'Unexpected registration state for {name}')
          updated = content.replace(commented, entry, 1)
          if updated.count(entry) != 1:
              raise RuntimeError(f'Registration is not unique for {name}')
          path.write_text(updated, encoding='utf-8')
          print(f'Enabled only {name}; preserved all other custom registrations.')
          PY
            git add -- "$EFFECT" "$REGISTRY"
            if [ -n "$(git ls-files -u)" ]; then
              echo "::error::Unresolved merge conflicts remain in PR #$pr."
              exit 1
            fi
            if ! cmp -s "$EFFECT" <(git show "$BASE_SHA:$EFFECT"); then
              echo '::error::Voting logic diverged from custom.'
              exit 1
            fi
            if [ "$(git hash-object "$file_to_keep")" != "$(git rev-parse "$original:$file_to_keep")" ]; then
              echo "::error::PR #$pr original card/test file unexpectedly changed."
              exit 1
            fi
            if [ -n "$second_file_to_keep" ] && [ "$(git hash-object "$second_file_to_keep")" != "$(git rev-parse "$original:$second_file_to_keep")" ]; then
              echo "::error::PR #$pr original test unexpectedly changed."
              exit 1
            fi
            git diff --cached --check -- "$EFFECT" "$REGISTRY"
            git commit -m "Resolve PR #$pr conflicts with custom (keep existing voting and enable $card)"
            git log -1 --format='%H %P %s'
            git push origin "HEAD:refs/heads/$branch"
          done
